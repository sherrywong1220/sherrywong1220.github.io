name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Set up Node for JavaScript compression
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Use the actual Pages address
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          ruby -ruri -ryaml -e '
            address = ENV.fetch("PAGES_URL", "")
            address = "https://example.invalid" if address.empty?
            uri = URI(address)
            origin = "#{uri.scheme}://#{uri.host}"
            origin += ":#{uri.port}" unless [80, 443].include?(uri.port)
            File.write("_config.pages.yml", {
              "url" => origin,
              "baseurl" => uri.path.sub(%r{/$}, "")
            }.to_yaml)
          '
      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --config _config.yml,_config.pages.yml --trace
      - name: Verify site links and content
        run: python3 scripts/check_site.py _site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
